<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YGO Share - Gestor de Decks</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-20">

    <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="font-bold text-lg">YGO <span class="text-amber-500">Share</span></h1>
            <select id="userSelect" onchange="changeUser(this.value)" class="bg-slate-800 text-sm p-1 rounded border border-slate-700"></select>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4">
        <!-- ESTOQUE -->
        <section id="estoque">
            <h2 class="text-xl font-bold mb-4">Estoque do Grupo</h2>
            <div id="stockGrid" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
        </section>
    </main>

    <script>
        // Estrutura de dados com suporte a Quantidade e Deck
        let db = JSON.parse(localStorage.getItem('ygo_db')) || {
            users: [{id: 'u1', name: 'Duelista 1'}],
            cards: []
        };
        let currentUser = localStorage.getItem('ygo_user') || 'u1';

        function save() {
            localStorage.setItem('ygo_db', JSON.stringify(db));
            localStorage.setItem('ygo_user', currentUser);
            render();
        }

        function render() {
            const grid = document.getElementById('stockGrid');
            grid.innerHTML = db.cards.map(c => `
                <div class="bg-slate-900 p-3 rounded-xl border border-slate-800">
                    <img src="${c.imageUrl}" class="w-full rounded mb-2">
                    <h3 class="font-bold text-sm truncate">${c.name}</h3>
                    <p class="text-xs text-slate-400">Deck: ${c.deckName || 'Nenhum'}</p>
                    <p class="text-xs text-amber-500 font-bold">Qtd: ${c.totalOwned} | Comigo: ${c.totalOwned - (c.loanedToId ? 1 : 0)}</p>
                    ${c.ownerId === currentUser ? `
                        <button onclick="directLend('${c.id}')" class="w-full mt-2 bg-amber-600 text-xs py-1 rounded">Emprestar 1</button>
                    ` : ''}
                </div>
            `).join('');
            lucide.createIcons();
        }

        function directLend(cardId) {
            const card = db.cards.find(c => c.id === cardId);
            const borrower = prompt("ID do usuário para emprestar:");
            if(borrower) {
                card.status = 'loaned';
                card.loanedToId = borrower;
                save();
            }
        }

        function changeUser(uid) { currentUser = uid; save(); }

        // Inicialização
        render();
    </script>
</body>
</html>
