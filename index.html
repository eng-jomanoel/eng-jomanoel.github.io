<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base Leste - ERP</title>
    <style>
        :root { --bg: #1e1e2e; --surface: #313244; --text: #cdd6f4; --primary: #89b4fa; --danger: #f38ba8; --success: #a6e3a1; --tab-inactive: #45475a; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 600px; }
        #login-screen, #app-screen { display: none; }
        .active { display: block !important; }
        input, button, select { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: none; box-sizing: border-box; font-size: 16px; }
        input, select { background-color: var(--surface); color: var(--text); }
        button { background-color: var(--primary); color: var(--bg); font-weight: bold; cursor: pointer; }
        button.btn-danger { background-color: var(--danger); }
        .tabs { display: flex; gap: 10px; margin: 20px 0; }
        .tabs button { margin: 0; background-color: var(--tab-inactive); color: var(--text); }
        .tabs button.tab-active { background-color: var(--primary); color: var(--bg); }
        .tab-content { display: none; }
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; }
        .modal-content { background-color: var(--bg); padding: 20px; border-radius: 12px; width: 90%; max-width: 400px; max-height: 90vh; overflow-y: auto; }
        .card-item { background-color: var(--surface); padding: 15px; border-radius: 8px; margin-top: 10px; display: flex; gap: 15px; align-items: center; }
        .card-img { width: 60px; border-radius: 4px; }
        .card-info { flex: 1; }
        .card-info h4 { margin: 0 0 5px 0; }
        .card-info p { margin: 0; font-size: 14px; opacity: 0.8; }
        .folder-badge { background-color: #f9e2af; color: #11111b; padding: 2px 6px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        #card-preview { text-align: center; margin-top: 10px; display: none; }
        #card-preview img { width: 120px; border-radius: 8px; }
        .radio-group { display: flex; gap: 10px; margin-top: 15px; background: var(--surface); padding: 10px; border-radius: 8px; }
        .radio-group label { display: flex; align-items: center; gap: 5px; cursor: pointer; font-size: 14px; }

        /* Autocomplete */
#autocomplete-results {
    background-color: var(--surface);
    border-radius: 8px;
    max-height: 200px;
    overflow-y: auto;
    margin-top: 5px;
    display: none;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
}
.autocomplete-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    cursor: pointer;
    border-bottom: 1px solid var(--bg);
}
.autocomplete-item:hover {
    background-color: var(--tab-inactive);
}
.autocomplete-item img {
    width: 35px;
    border-radius: 4px;
}
.autocomplete-item span {
    font-size: 14px;
    font-weight: bold;
}
    </style>
</head>
<body>

<div class="container">
    <div id="login-screen">
        <h2>Identificação - Base Leste</h2>
        <input type="text" id="username" placeholder="Seu nome...">
        <button onclick="entrar()">Entrar</button>
    </div>

    <div id="app-screen">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2 id="welcome-msg"></h2>
            <button onclick="sair()" style="width: auto; padding: 8px 15px; background: transparent; color: var(--danger); border: 1px solid var(--danger);">Sair</button>
        </div>
        
        <button onclick="abrirModal()">+ Nova Ação (Carta)</button>

        <div class="tabs">
            <button id="tab-btn-emprestimos" class="tab-active" onclick="mudarAba('emprestimos')">Empréstimos</button>
            <button id="tab-btn-inventario" onclick="mudarAba('inventario')">Meu Cofre</button>
        </div>

        <!-- Aba Emprestimos -->
        <div id="tab-emprestimos" class="tab-content active">
            <div id="lista-emprestimos">Carregando dados...</div>
        </div>

        <!-- Aba Inventario -->
        <div id="tab-inventario" class="tab-content">
            <div id="lista-inventario">Carregando dados...</div>
        </div>
    </div>
</div>

<!-- Modal Universal (Registro) -->
<div id="modal">
    <div class="modal-content">
        <h3>Registrar Carta</h3>
        <h3>Registrar Carta</h3>
<!-- O evento oninput chama a busca toda vez que você digita uma letra -->
<input type="text" id="busca-carta" placeholder="Digite parte do nome (EN ou PT)..." oninput="buscarAutocomplete()">

<!-- Lista onde os resultados vão aparecer em tempo real -->
<div id="autocomplete-results"></div>

<div id="card-preview">
    <img id="img-preview" src="" alt="Preview">
    <p id="nome-preview"></p>
</div>
        <button onclick="buscarCartaYGO()">Buscar Arte</button>
        
        <div id="card-preview">
            <img id="img-preview" src="" alt="Preview">
            <p id="nome-preview"></p>
        </div>

        <div id="opcoes-registro" style="display:none;">
            <div class="radio-group">
                <label><input type="radio" name="tipo_registro" value="emprestimo" checked onchange="toggleFormulario()"> Emprestar</label>
                <label><input type="radio" name="tipo_registro" value="inventario" onchange="toggleFormulario()"> Guardar no Cofre</label>
            </div>

            <!-- Form Emprestimo -->
            <div id="form-emprestimo">
                <input type="text" id="emprestado-para" placeholder="Para quem você vai emprestar?">
            </div>

            <!-- Form Inventario -->
            <div id="form-inventario" style="display:none;">
                <input type="text" id="nome-pasta" placeholder="Nome da Pasta (ex: Staples, Trocas)">
            </div>
            
            <button onclick="salvarAcao()" id="btn-salvar" style="background-color: var(--success);">Confirmar</button>
        </div>
        <button onclick="fecharModal()" class="btn-danger">Cancelar</button>
    </div>
</div>

<script>
    // COLOQUE SUA URL AQUI NOVAMENTE
    const API_URL = "https://script.google.com/macros/s/AKfycbz1cCgw-Sv_nEKRLylQCbghIOmmUeR_I0PmyvJugZZ8hbY2gO6TZ7QI3fFn9_qx5-_UkA/exec";
    
    let usuarioAtual = "";
    let cartaSelecionada = {};
    let dadosGlobais = { emprestimos: [], inventario: [] };

    function checarLogin() {
        const salvo = localStorage.getItem("bl_user");
        if (salvo) {
            usuarioAtual = salvo;
            document.getElementById("login-screen").classList.remove("active");
            document.getElementById("app-screen").classList.add("active");
            document.getElementById("welcome-msg").innerText = "Bem-vindo, " + usuarioAtual;
            carregarDados();
        } else {
            document.getElementById("login-screen").classList.add("active");
            document.getElementById("app-screen").classList.remove("active");
        }
    }

    function entrar() {
        const nome = document.getElementById("username").value.trim();
        if (nome) { localStorage.setItem("bl_user", nome); checarLogin(); }
    }

    function sair() { localStorage.removeItem("bl_user"); checarLogin(); }

    function mudarAba(aba) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tabs button').forEach(el => el.classList.remove('tab-active'));
        document.getElementById(`tab-${aba}`).classList.add('active');
        document.getElementById(`tab-btn-${aba}`).classList.add('tab-active');
    }

    async function carregarDados() {
        document.getElementById("lista-emprestimos").innerHTML = "Sincronizando Base Leste...";
        try {
            const resposta = await fetch(API_URL);
            dadosGlobais = await resposta.json();
            renderizarEmprestimos();
            renderizarInventario();
        } catch (e) {
            document.getElementById("lista-emprestimos").innerHTML = "Erro de conexão.";
        }
    }

    function renderizarEmprestimos() {
        let html = "";
        dadosGlobais.emprestimos.forEach(item => {
            const btnDevolver = item.dono === usuarioAtual 
                ? `<button class="btn-danger" style="padding: 5px; margin-top: 5px; font-size: 12px;" onclick="deletarRegistro('devolver', '${item.id}')">Devolvida</button>` : ``;
            html += `
            <div class="card-item">
                <img src="${item.imagem}" class="card-img">
                <div class="card-info">
                    <h4>${item.carta}</h4>
                    <p><strong>Dono:</strong> ${item.dono}</p>
                    <p><strong>Com:</strong> ${item.emprestado_para} (${item.data})</p>
                    ${btnDevolver}
                </div>
            </div>`;
        });
        document.getElementById("lista-emprestimos").innerHTML = html || "<p>Nada emprestado.</p>";
    }

    function renderizarInventario() {
        let html = "";
        const meuCofre = dadosGlobais.inventario.filter(item => item.dono === usuarioAtual);
        
        meuCofre.forEach(item => {
            html += `
            <div class="card-item">
                <img src="${item.imagem}" class="card-img">
                <div class="card-info">
                    <h4>${item.carta} <span class="folder-badge">${item.pasta}</span></h4>
                    <button class="btn-danger" style="padding: 5px; margin-top: 5px; font-size: 12px;" onclick="deletarRegistro('remover_inventario', '${item.id}')">Remover</button>
                </div>
            </div>`;
        });
        document.getElementById("lista-inventario").innerHTML = html || "<p>Seu cofre está vazio.</p>";
    }

   let timeoutBusca = null;

async function buscarAutocomplete() {
    const termo = document.getElementById("busca-carta").value.trim();
    const divResultados = document.getElementById("autocomplete-results");
    
    // Só começa a buscar se tiver pelo menos 3 letras
    if (termo.length < 3) {
        divResultados.style.display = "none";
        return;
    }

    // Limpa o timer anterior se a pessoa ainda estiver digitando (Debounce)
    clearTimeout(timeoutBusca);
    
    // Espera a pessoa parar de digitar por 500ms antes de chamar a API
    timeoutBusca = setTimeout(async () => {
        divResultados.innerHTML = "<div style='padding:10px; text-align:center;'>Buscando...</div>";
        divResultados.style.display = "block";
        
        try {
            // Fazemos duas buscas em paralelo: uma em Inglês e uma em Português
            const [resEN, resPT] = await Promise.all([
                fetch(`https://db.ygoprodeck.com/api/v7/cardinfo.php?fname=${encodeURIComponent(termo)}`).catch(() => null),
                fetch(`https://db.ygoprodeck.com/api/v7/cardinfo.php?language=pt&fname=${encodeURIComponent(termo)}`).catch(() => null)
            ]);
            
            let dataEN = resEN && resEN.ok ? await resEN.json() : { data: [] };
            let dataPT = resPT && resPT.ok ? await resPT.json() : { data: [] };
            
            // Junta os resultados
            let cartas = [...(dataEN.data || []), ...(dataPT.data || [])];
            
            // Remove cartas repetidas (caso a carta tenha o mesmo nome em PT e EN)
            let cartasUnicas = [];
            let ids = new Set();
            for (let c of cartas) {
                if (!ids.has(c.id)) {
                    ids.add(c.id);
                    cartasUnicas.push(c);
                }
            }

            // Pega apenas as 8 primeiras cartas para não travar a tela
            cartasUnicas = cartasUnicas.slice(0, 8);

            if (cartasUnicas.length === 0) {
                divResultados.innerHTML = "<div style='padding:10px; text-align:center;'>Nenhuma carta encontrada.</div>";
                return;
            }

            // Monta a lista visual
            let html = "";
            cartasUnicas.forEach(c => {
                // Trata aspas simples no nome para não quebrar o código
                const nomeStr = c.name.replace(/'/g, "\\'"); 
                const imgStr = c.card_images[0].image_url_small;
                
                html += `
                <div class="autocomplete-item" onclick="selecionarCarta('${nomeStr}', '${imgStr}')">
                    <img src="${imgStr}">
                    <span>${c.name}</span>
                </div>`;
            });
            
            divResultados.innerHTML = html;

        } catch (e) {
            divResultados.innerHTML = "<div style='padding:10px; text-align:center;'>Erro na busca.</div>";
        }
    }, 500);
}

// Quando o usuário clica em uma carta da lista
function selecionarCarta(nome, imagem) {
    cartaSelecionada = { nome: nome, imagem: imagem };
    
    // Preenche o input com o nome exato e esconde a lista
    document.getElementById("busca-carta").value = nome;
    document.getElementById("autocomplete-results").style.display = "none";
    
    // Mostra o preview
    document.getElementById("img-preview").src = imagem;
    document.getElementById("nome-preview").innerText = nome;
    document.getElementById("card-preview").style.display = "block";
    document.getElementById("opcoes-registro").style.display = "block";
}

    function toggleFormulario() {
        const tipo = document.querySelector('input[name="tipo_registro"]:checked').value;
        document.getElementById("form-emprestimo").style.display = tipo === 'emprestimo' ? 'block' : 'none';
        document.getElementById("form-inventario").style.display = tipo === 'inventario' ? 'block' : 'none';
    }

    async function salvarAcao() {
        const tipo = document.querySelector('input[name="tipo_registro"]:checked').value;
        let payload = { acao: tipo === 'emprestimo' ? 'emprestar' : 'adicionar_inventario', carta: cartaSelecionada.nome, dono: usuarioAtual, imagem: cartaSelecionada.imagem };

        if (tipo === 'emprestimo') {
            payload.emprestado_para = document.getElementById("emprestado-para").value;
            payload.data = new Date().toLocaleDateString('pt-BR');
            if (!payload.emprestado_para) return alert("Preencha com quem vai ficar!");
        } else {
            payload.pasta = document.getElementById("nome-pasta").value || "Geral";
        }

        document.getElementById("btn-salvar").innerText = "Processando...";
        await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
        fecharModal();
        carregarDados();
    }

    async function deletarRegistro(acao, id) {
        if(!confirm("Remover este registro?")) return;
        await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ acao: acao, id: id }) });
        carregarDados();
    }

    function abrirModal() {
        document.getElementById("modal").style.display = "flex";
        document.getElementById("card-preview").style.display = "none";
        document.getElementById("opcoes-registro").style.display = "none";
        document.getElementById("btn-salvar").innerText = "Confirmar";
    }
    function fecharModal() { document.getElementById("modal").style.display = "none"; }
    checarLogin();
</script>
</body>
</html>
