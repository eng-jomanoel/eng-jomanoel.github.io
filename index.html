<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YGO Deck Builder &amp; Probability Calculator</title>
  <meta name="description" content="Build a Yu-Gi-Oh! deck and simulate your opening hands: starter rate, brick rate, combo lines and siding.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%83%8F%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>

  <div class="drop-overlay" id="dropOverlay" hidden data-i18n="drop.overlay"></div>

  <header class="topbar">
    <div class="brand">
      <h1 data-i18n="app.title">YGO Deck Builder &amp; Probability Calculator</h1>
      <p data-i18n="app.subtitle"></p>
    </div>

    <div class="toolbar">
      <div class="tool-group">
        <label class="btn file-btn"><span data-i18n="btn.import"></span>
          <input type="file" id="ydkInput" accept=".ydk,text/plain">
        </label>
        <button type="button" class="btn" id="exportBtn" data-i18n="btn.export"></button>
        <button type="button" class="btn btn-accent" id="shareBtn" data-i18n="btn.share"></button>
      </div>

      <div class="tool-group">
        <select id="savedDecks" data-i18n-aria="aria.saved"></select>
        <button type="button" class="btn" id="saveDeckBtn" data-i18n="btn.save"></button>
        <button type="button" class="btn btn-ghost-danger" id="deleteDeckBtn" data-i18n="btn.delete"></button>
      </div>

      <div class="tool-group">
        <select id="handSize" data-i18n-aria="aria.hand">
          <option value="5" data-i18n="opt.first"></option>
          <option value="6" data-i18n="opt.second"></option>
        </select>
        <select id="trials" data-i18n-aria="aria.trials">
          <option value="50000"></option>
          <option value="100000" selected></option>
          <option value="500000"></option>
        </select>
        <select id="langSelect" data-i18n-aria="aria.lang">
          <option value="en">English</option>
          <option value="pt">Português (Brasil)</option>
        </select>
        <button type="button" class="btn btn-danger" id="clearBtn" data-i18n="btn.clear"></button>
      </div>
    </div>
  </header>

  <div class="status" id="statusBar" hidden></div>

  <div class="layout">

    <!-- ============ LEFT: deck views ============ -->
    <main class="main-col">
      <nav class="tabs" role="tablist">
        <button type="button" class="tab-btn active" role="tab" aria-selected="true" data-tab="grid" data-i18n="tab.grid"></button>
        <button type="button" class="tab-btn" role="tab" aria-selected="false" data-tab="table" data-i18n="tab.table"></button>
        <button type="button" class="tab-btn" role="tab" aria-selected="false" data-tab="siding" data-i18n="tab.siding"></button>
      </nav>

      <!-- ---- Deck grid ---- -->
      <section id="tab-grid" class="tab-pane" role="tabpanel">
        <div class="panel">
          <div class="panel-head">
            <h2 data-i18n="add.title"></h2>
            <label class="inline-field"><span data-i18n="add.to"></span>
              <select id="addTo">
                <option value="auto" data-i18n="add.auto"></option>
                <option value="side" data-i18n="add.side"></option>
              </select>
            </label>
          </div>
          <input type="search" id="searchInput" class="search-input" data-i18n-ph="search.ph" autocomplete="off" spellcheck="false">
          <p class="hint" id="searchStatus" aria-live="polite"></p>
          <div id="searchResults" class="search-results"></div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <h2><span data-i18n="deck.main"></span> <span class="chip" id="mainCount">0</span></h2>
            <button type="button" class="btn btn-small" id="resetRolesBtn" data-i18n="btn.resetRoles"></button>
          </div>
          <div class="brush-row">
            <div class="legend" id="legend"></div>
            <p class="hint" id="brushHint"></p>
          </div>
          <div id="mainGrid" class="card-grid"></div>
        </div>

        <div class="panel">
          <div class="panel-head"><h2><span data-i18n="deck.extra"></span> <span class="chip" id="extraCount">0</span></h2></div>
          <div id="extraGrid" class="card-grid"></div>
        </div>

        <div class="panel">
          <div class="panel-head"><h2><span data-i18n="deck.side"></span> <span class="chip" id="sideCount">0</span></h2></div>
          <div id="sideGrid" class="card-grid"></div>
        </div>
      </section>

      <!-- ---- Role table ---- -->
      <section id="tab-table" class="tab-pane" role="tabpanel" hidden>
        <div class="panel">
          <div class="panel-head">
            <h2><span data-i18n="table.title"></span> <span class="chip" id="tableCount">0</span></h2>
          </div>
          <div class="table-tools">
            <input type="search" id="tableFilter" class="search-input" data-i18n-ph="filter.ph" autocomplete="off">
            <label class="check"><input type="checkbox" id="onlyUnassigned"> <span data-i18n="only.unassigned"></span></label>
          </div>
          <p class="hint" data-i18n="table.hint"></p>
          <p class="hint" data-i18n="table.hint2"></p>
          <div class="table-wrap">
            <table class="role-table">
              <thead>
                <tr>
                  <th data-i18n="th.card"></th>
                  <th data-i18n="th.copies"></th>
                  <th data-i18n="th.role"></th>
                  <th data-i18n="th.uses"></th>
                </tr>
              </thead>
              <tbody id="roleTableBody"></tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- ---- Siding ---- -->
      <section id="tab-siding" class="tab-pane" role="tabpanel" hidden>
        <div class="panel">
          <div class="panel-head">
            <h2 data-i18n="siding.title"></h2>
            <button type="button" class="btn btn-ghost-danger btn-small" id="resetSidingBtn" data-i18n="btn.resetSiding"></button>
          </div>
          <p class="hint" data-i18n="siding.hint"></p>
          <p class="hint" id="sidingSummary"></p>
          <div class="siding-cols">
            <div class="siding-col">
              <h3><span data-i18n="deck.main"></span> <span class="chip" id="sideMainCount">0</span></h3>
              <div id="sidingMainList" class="card-grid small"></div>
            </div>
            <div class="siding-col">
              <h3><span data-i18n="deck.side"></span> <span class="chip" id="sideSideCount">0</span></h3>
              <div id="sidingSideList" class="card-grid small"></div>
            </div>
          </div>
        </div>
      </section>

      <details class="panel help">
        <summary data-i18n="help.summary"></summary>
        <div class="help-body">
          <p data-i18n-html="help.1"></p>
          <p data-i18n-html="help.2"></p>
          <p data-i18n-html="help.3"></p>
          <p data-i18n-html="help.4"></p>
          <p data-i18n-html="help.5"></p>
          <p data-i18n-html="help.6"></p>
        </div>
      </details>
    </main>

    <!-- ============ RIGHT: analytics ============ -->
    <aside class="sidebar">
      <div class="panel">
        <div class="panel-head">
          <h2 data-i18n="results.title"></h2>
          <span class="sim-meta"><span id="simSpeed">0 ms</span>
            <button type="button" class="btn btn-small btn-icon" id="rerollBtn" data-i18n-title="results.reroll" data-i18n-aria="results.reroll">&#8635;</button>
          </span>
        </div>
        <p class="hint" id="simNote"></p>

        <div class="stat-grid">
          <div class="stat good">
            <div class="stat-val"><span id="playableRate">0.0%</span><span class="delta" id="playableDelta"></span></div>
            <div class="stat-label" data-i18n="stat.playable"></div>
          </div>
          <div class="stat bad">
            <div class="stat-val"><span id="brickRate">0.0%</span><span class="delta" id="brickDelta"></span></div>
            <div class="stat-label" data-i18n="stat.brick"></div>
          </div>
          <div class="stat gold wide">
            <div class="stat-val"><span id="targetRate">0.0%</span><span class="delta" id="targetDelta"></span></div>
            <div class="stat-label" data-i18n="stat.goal"></div>
          </div>
        </div>

        <h3 class="sub-title" data-i18n="avg.title"></h3>
        <div class="avg-table" id="avgList"></div>
      </div>

      <div class="panel">
        <div class="panel-head"><h2 data-i18n="goal.title"></h2></div>
        <div class="crit-grid">
          <label><span data-i18n="goal.starters"></span> <input type="number" data-crit="starters" min="0" max="6" value="0"></label>
          <label><span data-i18n="goal.comboA"></span> <input type="number" data-crit="comboA" min="0" max="6" value="0"></label>
          <label><span data-i18n="goal.comboB"></span> <input type="number" data-crit="comboB" min="0" max="6" value="0"></label>
          <label><span data-i18n="goal.extenders"></span> <input type="number" data-crit="extenders" min="0" max="6" value="0"></label>
          <label><span data-i18n="goal.handtraps"></span> <input type="number" data-crit="handtraps" min="0" max="6" value="0"></label>
          <label><span data-i18n="goal.maxBricks"></span> <input type="number" data-crit="maxBricks" min="0" max="6" value="0"></label>
        </div>
        <div class="crit-specific">
          <label><span data-i18n="goal.mustDraw"></span>
            <select id="critSpecific" data-crit="specific"><option value=""></option></select>
          </label>
          <label><span data-i18n="goal.copies"></span> <input type="number" data-crit="specificQty" min="1" max="3" value="1"></label>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2 data-i18n="combo.title"></h2>
          <button type="button" class="btn btn-small" id="addComboBtn" data-i18n="btn.addCombo"></button>
        </div>
        <p class="hint" data-i18n="combo.hint"></p>
        <div id="comboList"></div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2 data-i18n="hands.title"></h2>
          <button type="button" class="btn btn-small btn-accent" id="drawHandBtn" data-i18n="btn.draw"></button>
        </div>
        <div id="testHand" class="hand"></div>
        <p class="hint" id="testHandVerdict"></p>

        <h3 class="sub-title"><span data-i18n="hands.best"></span> <span class="sim-meta" id="bestHandScore"></span></h3>
        <div id="bestHand" class="hand"></div>
        <p class="hint" id="bestHandHint"></p>
      </div>
    </aside>
  </div>

  <footer class="footer" data-i18n-html="footer"></footer>

  <div class="mini-bar" id="miniBar" aria-hidden="true">
    <span><b id="miniPlayable">0.0%</b> <span data-i18n="mini.playable"></span></span>
    <span><b id="miniBrick">0.0%</b> <span data-i18n="mini.brick"></span></span>
    <span><b id="miniTarget">0.0%</b> <span data-i18n="mini.goal"></span></span>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="preview" id="preview" hidden><img alt=""><span></span></div>
</body>
</html>
