<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YGO Share - Gerenciador</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { padding-bottom: 76px; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans">

    <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-40">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="font-bold text-lg text-white">YGO <span class="text-amber-400">Share</span></h1>
            <select id="activeUserSelect" onchange="changeActiveUser(this.value)" class="bg-slate-800 border border-slate-700 text-sm rounded-lg p-1.5 text-amber-400"></select>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 mb-6">
            <h3 class="text-sm font-semibold text-amber-400 mb-3">Adicionar Carta ao Estoque</h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
                <input type="text" id="addName" placeholder="Nome da carta" class="bg-slate-950 border border-slate-800 rounded p-2 text-sm">
                <input type="number" id="addQty" placeholder="Qtd" class="bg-slate-950 border border-slate-800 rounded p-2 text-sm">
                <input type="text" id="addDeck" placeholder="Nome do Deck/Pasta" class="bg-slate-950 border border-slate-800 rounded p-2 text-sm">
            </div>
            <button onclick="addManualCard()" class="w-full mt-3 bg-amber-500 text-slate-950 font-bold py-2 rounded text-sm">Adicionar Carta</button>
        </div>

        <div id="stockGrid" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
    </main>

    <script>
        let db = JSON.parse(localStorage.getItem('ygo_loan_db')) || { users: [{id: "u1", name: "Você"}], cards: [] };
        let currentUser = localStorage.getItem('ygo_active_user') || db.users[0].id;

        function save() {
            localStorage.setItem('ygo_loan_db', JSON.stringify(db));
            localStorage.setItem('ygo_active_user', currentUser);
            render();
        }

        function addManualCard() {
            const name = document.getElementById('addName').value;
            const qty = parseInt(document.getElementById('addQty').value);
            const deck = document.getElementById('addDeck').value || "Sem pasta";
            if(!name || !qty) return alert("Preencha nome e quantidade!");
            
            db.cards.push({ id: 'c_'+Date.now(), name, total: qty, deck, ownerId: currentUser, loaned: 0 });
            save();
        }

        function lendDeck(deckName) {
            const user = prompt("ID do amigo:");
            if(!user) return;
            db.cards.forEach(c => {
                if(c.deck === deckName && c.ownerId === currentUser) c.loaned = c.total;
            });
            save();
        }

        function render() {
            const grid = document.getElementById('stockGrid');
            grid.innerHTML = db.cards.map(c => `
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-3">
                    <h3 class="font-bold text-sm text-white">${c.name}</h3>
                    <p class="text-xs text-amber-500">Pasta: ${c.deck}</p>
                    <p class="text-xs text-slate-400">Total: ${c.total} | Emprestadas: ${c.loaned}</p>
                    ${c.ownerId === currentUser ? `
                        <button onclick="lendDeck('${c.deck}')" class="w-full mt-2 bg-slate-700 hover:bg-slate-600 text-white text-xs py-1 rounded">Emprestar Deck Todo</button>
                    ` : ''}
                </div>
            `).join('');
            
            // Popula seletor de usuário
            const select = document.getElementById('activeUserSelect');
            select.innerHTML = db.users.map(u => `<option value="${u.id}" ${u.id === currentUser ? 'selected' : ''}>${u.name}</option>`).join('');
        }

        function changeActiveUser(uid) { currentUser = uid; save(); }
        render();
    </script>
</body>
</html>
