<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YGO Share - Gerenciador de Empréstimos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ygo: {
                            gold: '#D4AF37',
                            darkgold: '#AA7C11',
                            dark: '#0B0F19',
                            card: '#1E293B',
                            accent: '#F59E0B'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #D4AF37; }
        body { padding-bottom: 76px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased">

    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-40 px-4 py-3 shadow-lg">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="bg-gradient-to-r from-amber-500 to-yellow-600 p-1.5 rounded-lg shadow-md">
                    <i data-lucide="swords" class="w-6 h-6 text-slate-950"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight text-white flex items-center gap-1">
                        YGO <span class="text-amber-400">Share</span>
                    </h1>
                    <p class="text-xs text-slate-400">Gerenciador do Grupo</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-2">
                <span class="text-xs text-slate-400 hidden sm:inline">Quem é você?</span>
                <select id="activeUserSelect" onchange="changeActiveUser(this.value)" class="bg-slate-800 border border-slate-700 text-sm rounded-lg focus:ring-amber-500 focus:border-amber-500 block px-2.5 py-1.5 text-amber-400 font-medium">
                </select>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4">
        
        <section id="tab-estoque" class="tab-content">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-6 gap-4">
                <div>
                    <h2 class="text-xl font-bold text-white flex items-center gap-2">
                        <i data-lucide="library" class="text-amber-400"></i> Estoque do Grupo
                    </h2>
                </div>
                <div class="flex gap-2">
                    <input type="text" id="searchStockInput" oninput="renderStock()" placeholder="Pesquisar..." class="bg-slate-900 border border-slate-800 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:border-amber-500 w-full sm:w-64">
                </div>
            </div>
            <div id="stockGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4"></div>
        </section>

        <section id="tab-pasta" class="tab-content hidden">
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 mb-6">
                <h3 class="text-sm font-semibold text-amber-400 mb-3">Adicionar Carta Manualmente</h3>
                <div class="flex flex-col gap-2">
                    <input type="text" id="manualName" placeholder="Nome da carta" class="bg-slate-950 border border-slate-800 rounded-lg p-2 text-sm">
                    <div class="flex gap-2">
                        <input type="number" id="manualQty" placeholder="Qtd" class="bg-slate-950 border border-slate-800 rounded-lg p-2 text-sm w-20">
                        <input type="text" id="manualDeck" placeholder="Nome do Deck" class="bg-slate-950 border border-slate-800 rounded-lg p-2 text-sm flex-1">
                    </div>
                    <button onclick="addManualCard()" class="bg-amber-500 text-slate-950 font-bold p-2 rounded-lg text-sm">Adicionar ao Estoque</button>
                </div>
            </div>
            <div id="myInventoryGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4"></div>
        </section>

        </main>

    <script>
        // Adicionado: total, deckName
        function addManualCard() {
            const name = document.getElementById('manualName').value;
            const qty = parseInt(document.getElementById('manualQty').value);
            const deck = document.getElementById('manualDeck').value;
            
            db.cards.push({ 
                id: 'c_' + Date.now(), 
                apiId: 'manual', 
                name: name, 
                imageUrl: 'https://via.placeholder.com/150', // Placeholder para manual
                ownerId: currentUser, 
                status: 'available', 
                total: qty || 1, 
                deck: deck || "Pasta Geral" 
            });
            saveDB(); renderAll(); showToast("Carta adicionada!");
        }

        // --- Mantenha suas funções originais de render e saveDB ---
        // Apenas altere o renderStock para mostrar: c.total e c.deck
        // Exemplo: <p>Deck: ${c.deck}</p><p>Total: ${c.total}</p>
    </script>
</body>
</html>
